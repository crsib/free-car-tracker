name: Release

# Build a signed release APK and attach it to the GitHub Release.
# Triggers when a release is published in the GitHub UI (or via `gh release create`).
on:
  release:
    types: [published]

permissions:
  contents: write # required to upload assets to the release

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # vendored kotlin-obd-api is compiled from sources

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Recreate the gitignored signing material from repository secrets so the
      # existing app/build.gradle.kts (which keys off keystore.properties) signs
      # the release build unchanged. Skipped if no keystore secret is configured,
      # producing an unsigned release instead of failing.
      - name: Decode signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # Version comes from app/build.gradle.kts (versionName/versionCode) so the
      # APK metadata and filename share a single source of truth.
      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved version $VERSION_NAME ($VERSION_CODE)"

      - name: Rename APK with app version
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/free-car-tracker-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"
          done

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/*.apk
          if-no-files-found: error
